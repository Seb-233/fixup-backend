---
apiVersion: v1
kind: Service
metadata:
  name: bg02-demo-green
  namespace: fixup-green
spec:
  type: ClusterIP
  selector:
    fixup.environment: green
    fixup.role: backend
  ports:
  - name: http
    port: 8080
    protocol: TCP
    targetPort: 8080
  sessionAffinity: None
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fixup-backend-green
  namespace: fixup-green
spec:
  selector:
    matchLabels:
      fixup.environment: green
      fixup.role: backend
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
    type: RollingUpdate
  template:
    metadata:
      labels:
        fixup.environment: green
        fixup.role: backend
    spec:
      automountServiceAccountToken: false
      containers:
      - env:
        - name: SPRING_PROFILES_ACTIVE
          value: green
        - name: JAVA_TOOL_OPTIONS
          value: -XX:MaxRAMPercentage=70
        - name: FIXUP_RLS_STRICT
          value: 'true'
        - name: FIXUP_RLS_IDENTITY_ROLE
          value: 'true'
        - name: SPRING_FLYWAY_ENABLED
          value: 'false'
        - name: FIXUP_SCHEDULING_ENABLED
          value: 'false'
        - name: FIXUP_SEED_ENABLED
          value: 'false'
        - name: FIXUP_MEDIA_DELETION_ENABLED
          value: 'false'
        envFrom:
        - configMapRef:
            name: green-backend-config
        - secretRef:
            name: green-backend-db-secret
        - secretRef:
            name: green-backend-storage-secret
        image: ghcr.io/seb-233/fixup-backend@sha256:fcbdc4e4ac0c6478e36be455cd9ed234252a19724bb33ddb34d19282d2817b6b
        imagePullPolicy: Always
        livenessProbe:
          failureThreshold: 3
          periodSeconds: 20
          successThreshold: 1
          tcpSocket:
            port: http
          timeoutSeconds: 3
        name: backend
        ports:
        - containerPort: 8080
          name: http
          protocol: TCP
        readinessProbe:
          failureThreshold: 3
          httpGet:
            path: /actuator/health
            port: http
            scheme: HTTP
          periodSeconds: 10
          successThreshold: 1
          timeoutSeconds: 3
        resources:
          limits:
            cpu: '1'
            memory: 1Gi
          requests:
            cpu: 250m
            memory: 512Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        startupProbe:
          failureThreshold: 36
          httpGet:
            path: /actuator/health
            port: http
            scheme: HTTP
          periodSeconds: 5
          successThreshold: 1
          timeoutSeconds: 3
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
      dnsPolicy: ClusterFirst
      initContainers:
      - command:
        - /bin/sh
        - /scripts/wait-postgres.sh
        env:
        - name: PGHOST
          value: postgres.fixup-green.svc.cluster.local
        - name: PGPORT
          value: '5432'
        - name: PGDATABASE
          value: fixup_green
        - name: PGUSER
          valueFrom:
            secretKeyRef:
              key: DATABASE_USERNAME
              name: green-backend-db-secret
        - name: PGPASSWORD
          valueFrom:
            secretKeyRef:
              key: DATABASE_PASSWORD
              name: green-backend-db-secret
        - name: PGCONNECT_TIMEOUT
          value: '4'
        image: postgres@sha256:f4c66b820c6f974249089d3d16d86a3698eae11e8746eb6644b2271031e91232
        imagePullPolicy: IfNotPresent
        name: wait-postgres
        resources:
          limits:
            cpu: 100m
            memory: 64Mi
          requests:
            cpu: 10m
            memory: 16Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
          runAsGroup: 999
          runAsNonRoot: true
          runAsUser: 999
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - mountPath: /scripts
          name: scripts
          readOnly: true
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 30
      volumes:
      - configMap:
          defaultMode: 420
          name: green-backend-wait
        name: scripts
