# BG-02 1B: explicit PVC for the existing StatefulSet volumeClaimTemplate.
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: data-postgres-0
  namespace: fixup-green
  labels:
    fixup.environment: green
    fixup.role: postgres
spec:
  accessModes:
  - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 2Gi
