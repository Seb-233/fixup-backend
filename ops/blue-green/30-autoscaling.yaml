apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: fixup-backend-green-hpa
  namespace: fixup-green
  labels:
    fixup.environment: green
    fixup.role: backend
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: fixup-backend-green

  minReplicas: 2
  maxReplicas: 4

  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70

  behavior:
    scaleUp:
      stabilizationWindowSeconds: 30
      selectPolicy: Min
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60

    scaleDown:
      stabilizationWindowSeconds: 300
      selectPolicy: Min
      policies:
        - type: Pods
          value: 1
          periodSeconds: 120
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: fixup-backend-green
  namespace: fixup-green
  labels:
    fixup.environment: green
    fixup.role: backend
spec:
  minAvailable: 1
  selector:
    matchLabels:
      fixup.environment: green
      fixup.role: backend
