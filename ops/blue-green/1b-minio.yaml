# BG-02 1B: Service and StatefulSet, after the matching PVC is Bound.
---
apiVersion: v1
kind: Service
metadata:
  name: minio
  namespace: fixup-green
spec:
  clusterIP: None
  selector:
    fixup.role: minio
  ports:
  - name: api
    port: 9000
    targetPort: 9000
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: minio
  namespace: fixup-green
spec:
  serviceName: minio
  replicas: 1
  selector:
    matchLabels:
      fixup.role: minio
  template:
    metadata:
      labels:
        fixup.role: minio
        fixup.environment: green
    spec:
      serviceAccountName: green-runtime
      automountServiceAccountToken: false
      containers:
      - name: minio
        image: ghcr.io/seb-233/fixup-minio@sha256:a1a8bd4ac40ad7881a245bab97323e18f971e4d4cba2c2007ec1bedd21cbaba2
        imagePullPolicy: Never
        args:
        - server
        - /data
        - --console-address
        - :9001
        ports:
        - containerPort: 9000
          name: api
        envFrom:
        - secretRef:
            name: green-minio-secret
        volumeMounts:
        - name: data
          mountPath: /data
        readinessProbe:
          httpGet:
            path: /minio/health/ready
            port: api
          periodSeconds: 10
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 250m
            memory: 512Mi
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes:
      - ReadWriteOnce
      storageClassName: local-path
      resources:
        requests:
          storage: 2Gi
