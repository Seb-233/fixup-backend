services:
  backend:
    build: .
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DATABASE_URL: ${DATABASE_URL:?Define DATABASE_URL in .env}
      DATABASE_USERNAME: ${DATABASE_USERNAME:?Define DATABASE_USERNAME in .env}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?Define DATABASE_PASSWORD in .env}
      AUTH0_ISSUER_URI: ${AUTH0_ISSUER_URI:?Define AUTH0_ISSUER_URI in .env}
      AUTH0_AUDIENCE: ${AUTH0_AUDIENCE:?Define AUTH0_AUDIENCE in .env}
      AUTH0_JWK_SET_URI: ${AUTH0_JWK_SET_URI:-${AUTH0_ISSUER_URI}.well-known/jwks.json}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?Define CORS_ALLOWED_ORIGINS in .env}
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8080}:8080"
    depends_on:
      database:
        condition: service_healthy
        required: false
  database:
    image: postgres:17
    profiles: [database]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Define POSTGRES_DB in .env}
      POSTGRES_USER: ${DATABASE_USERNAME:?Define DATABASE_USERNAME in .env}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?Define DATABASE_PASSWORD in .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
volumes:
  postgres-data:
