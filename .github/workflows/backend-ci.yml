name: Backend CI

on:
  push:
    branches:
      - main
      - develop
      - 'setup/**'
      - 'feature/**'
      - 'fix/**'
      - 'test/**'
      - 'docs/**'
      - 'release/**'
      - 'hotfix/**'
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-integrity:
    name: Repository integrity
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify Git Diff Check
        run: git diff --check

      - name: Verify Flyway Historical Immutability
        if: github.event_name == 'pull_request'
        run: |
          BASE_SHA=${{ github.event.pull_request.base.sha }}

          git ls-tree -r $BASE_SHA --name-only | grep -E 'src/main/resources/db/migration.*/V[0-9]+__.*\.sql$' > base_migrations.txt || true

          if [ -s base_migrations.txt ]; then
            for file in $(cat base_migrations.txt); do
              if [ ! -f "$file" ]; then
                echo "Migration $file was deleted or renamed in HEAD!"
                exit 1
              fi
              git show $BASE_SHA:$file | cmp -s "$file" -
              if [ $? -ne 0 ]; then
                echo "Migration $file was modified in HEAD!"
                exit 1
              fi
            done
          fi

      - name: Verify Flyway Uniqueness
        run: |
          FILES=$(find src/main/resources/db -name "V*.sql")
          DUPLICATES=$(echo "$FILES" | sed -E 's/.*\/V([0-9]+)__.*/\1/' | sort | uniq -d)

          if [ ! -z "$DUPLICATES" ]; then
            for V in $DUPLICATES; do
              echo "Flyway version V${V} is duplicated:"
              echo "$FILES" | grep -E "\/V${V}__"
            done
            exit 1
          fi

  branch-freshness:
    name: Branch freshness
    runs-on: ubuntu-24.04
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check if branch is behind base
        run: |
          BASE_SHA=${{ github.event.pull_request.base.sha }}
          HEAD_SHA=${{ github.event.pull_request.head.sha }}

          BEHIND=$(git rev-list --count $HEAD_SHA..$BASE_SHA)

          echo "Base SHA: $BASE_SHA"
          echo "Head SHA: $HEAD_SHA"
          echo "Commits behind: $BEHIND"

          if [ "$BEHIND" -gt 0 ]; then
            echo "Branch is behind base by $BEHIND commits. Please merge or rebase."
            exit 1
          fi

  backend-verification:
    name: Backend verification
    runs-on: ubuntu-24.04
    needs: repository-integrity
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Compile and verify
        run: ./mvnw --batch-mode --no-transfer-progress -Ppostgres-it clean verify

      - name: Publish artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: |
            target/surefire-reports/
            target/site/jacoco/
            target/failsafe-reports/
            target/openapi.json
          if-no-files-found: warn

  openapi-contract:
    name: OpenAPI contract
    runs-on: ubuntu-24.04
    needs: backend-verification
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download OpenAPI artifact
        uses: actions/download-artifact@v4
        with:
          name: backend-test-reports
          path: target/

      - name: Check OpenAPI drift
        run: |
          if ! cmp -s docs/openapi.json target/openapi.json; then
            echo "OpenAPI contract drift detected. Please regenerate docs/openapi.json."
            exit 1
          fi