name: Backend CI
on:
  push:
    branches: [main, develop, 'setup/**', 'feature/**', 'fix/**', 'test/**', 'docs/**', 'release/**', 'hotfix/**']
  pull_request:
    branches: [main, develop]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Compile and verify architecture and tests
        run: ./mvnw --batch-mode --no-transfer-progress -Ppostgres-it clean verify
      - name: Publish test and coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: |
            target/surefire-reports/
            target/site/jacoco/
            target/failsafe-reports/
            target/openapi.json
          if-no-files-found: warn
