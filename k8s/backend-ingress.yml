# Ingress — exposes the backend to external traffic via an Ingress Controller.
# Requires an ingress controller installed in the cluster (e.g. ingress-nginx).
#
# To install ingress-nginx on a self-hosted cluster:
#   kubectl apply -f https://raw.githubusercontent.com/kubernetes/ingress-nginx/controller-v1.11.1/deploy/static/provider/baremetal/deploy.yaml
#
# Replace <your-domain-or-ip> below with your actual hostname or IP.
# If you don't have a domain, you can use the node IP and a path-based route.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: fixup-backend
  namespace: fixup
  labels:
    app: fixup-backend
    app.kubernetes.io/part-of: fixup
  annotations:
    traefik.ingress.kubernetes.io/proxy-read-timeout: "60"
    traefik.ingress.kubernetes.io/proxy-body-size: "15m"    # allow media uploads (max-file-size is 10MB)
spec:
  ingressClassName: traefik
  rules:
    - host: ""       # IP directa: dejar vacío usa NodePort/LoadBalancer, o pon tu dominio
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: fixup-backend
                port:
                  number: 8080
  # Uncomment and configure for TLS (requires cert-manager or manual secret):
  # tls:
  #   - hosts:
  #       - <your-domain>
  #     secretName: fixup-backend-tls
