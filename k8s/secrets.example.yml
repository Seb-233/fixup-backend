# ============================================================
# secrets.example.yml — PLANTILLA DE REFERENCIA
# ============================================================
# Este archivo documenta los Secrets que el workflow cd.yml
# crea automáticamente en cada deploy usando GitHub Secrets.
# NO commitees este archivo con valores reales.
#
# Los valores deben registrarse en:
#   GitHub → Settings → Secrets and variables → Actions
# ============================================================

# ── GitHub Secrets requeridos ──────────────────────────────
# Nombre del secret      Descripción
# ─────────────────────────────────────────────────────────
# KUBE_CONFIG            Kubeconfig del cluster, codificado en base64
#                        Generar: cat ~/.kube/config | base64 -w 0
#
# GHCR_PAT               Personal Access Token con scope: read:packages
#                        Usado como imagePullSecret en el cluster
#
# POSTGRES_DB            Nombre de la base de datos (ej: fixup)
# POSTGRES_USER          Usuario de PostgreSQL (ej: fixup)
# POSTGRES_PASSWORD      Contraseña de PostgreSQL (usa algo seguro)
#
# MINIO_ROOT_USER        Usuario root de MinIO (ej: fixup)
# MINIO_ROOT_PASSWORD    Contraseña root de MinIO (min 8 caracteres)
#
# AUTH0_ISSUER_URI       Ej: https://your-tenant.auth0.com/
# AUTH0_AUDIENCE         Ej: https://api.yourdomain.com
#
# CORS_ALLOWED_ORIGINS   Ej: https://app.yourdomain.com
#
# FIXUP_STORAGE_PUBLIC_ENDPOINT  URL pública de MinIO accesible desde el cliente
#                                Ej: https://storage.yourdomain.com
# FIXUP_STORAGE_BUCKET   Nombre del bucket (ej: fixup-private)
# FIXUP_STORAGE_REGION   Ej: us-east-1

# ── Kubernetes Secrets generados por cd.yml ────────────────

# postgres-secret  →  usado por postgres StatefulSet
# ---
# apiVersion: v1
# kind: Secret
# metadata:
#   name: postgres-secret
#   namespace: fixup
# stringData:
#   POSTGRES_DB: <POSTGRES_DB>
#   POSTGRES_USER: <POSTGRES_USER>
#   POSTGRES_PASSWORD: <POSTGRES_PASSWORD>

# minio-secret  →  usado por minio StatefulSet
# ---
# apiVersion: v1
# kind: Secret
# metadata:
#   name: minio-secret
#   namespace: fixup
# stringData:
#   MINIO_ROOT_USER: <MINIO_ROOT_USER>
#   MINIO_ROOT_PASSWORD: <MINIO_ROOT_PASSWORD>

# backend-secret  →  usado por fixup-backend Deployment (envFrom)
# ---
# apiVersion: v1
# kind: Secret
# metadata:
#   name: backend-secret
#   namespace: fixup
# stringData:
#   DATABASE_URL: jdbc:postgresql://postgres:5432/<POSTGRES_DB>
#   DATABASE_USERNAME: <POSTGRES_USER>
#   DATABASE_PASSWORD: <POSTGRES_PASSWORD>
#   AUTH0_ISSUER_URI: <AUTH0_ISSUER_URI>
#   AUTH0_AUDIENCE: <AUTH0_AUDIENCE>
#   CORS_ALLOWED_ORIGINS: <CORS_ALLOWED_ORIGINS>
#   FIXUP_STORAGE_ENDPOINT: http://minio:9000
#   FIXUP_STORAGE_PUBLIC_ENDPOINT: <FIXUP_STORAGE_PUBLIC_ENDPOINT>
#   FIXUP_STORAGE_ACCESS_KEY: <MINIO_ROOT_USER>
#   FIXUP_STORAGE_SECRET_KEY: <MINIO_ROOT_PASSWORD>
#   FIXUP_STORAGE_BUCKET: <FIXUP_STORAGE_BUCKET>
#   FIXUP_STORAGE_REGION: <FIXUP_STORAGE_REGION>
