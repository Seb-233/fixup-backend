spring:
  config:
    activate:
      on-profile: dev
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
fixup:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
  storage:
    endpoint: ${FIXUP_STORAGE_ENDPOINT:http://localhost:9000}
    access-key: ${FIXUP_STORAGE_ACCESS_KEY:fixup}
    secret-key: ${FIXUP_STORAGE_SECRET_KEY:development-only-secret}
    auto-create-bucket: true
  media:
    deletion:
      enabled: true
      polling-delay: 30s
      batch-size: 10
      lock-timeout: 5m
      max-attempts: 5
      initial-backoff: 30s
  analytics:
    market-source:
      # Respaldo sintético de FR-UC-15: solo bajo el perfil dev y solo declarándolo aquí. Ningún
      # otro perfil puede activarlo, y la respuesta marca el dato como DEVELOPMENT_SYNTHETIC.
      provider: development
