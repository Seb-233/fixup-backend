spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          # Demo profile keeps the real Auth0 tenant as primary issuer (for real Auth0 logins via
          # the frontend SPA flow). The @Primary dual-decoder additionally accepts JWTs issued by
          # /demo/token (https://demo.fixup.local/) for scripted smoke testing without Auth0 M2M
          # credentials.
          issuer-uri: ${AUTH0_ISSUER_URI:https://dev-uzssz142azr2k5hv.us.auth0.com/}
          audiences: ${AUTH0_AUDIENCE:urn:fixup:api}
          jwk-set-uri: ${AUTH0_JWK_SET_URI:https://dev-uzssz142azr2k5hv.us.auth0.com/.well-known/jwks.json}
management:
  endpoints:
    enabled-by-default: false
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      enabled: true
      show-details: always
      show-components: always
    info:
      enabled: true
    metrics:
      enabled: true
    prometheus:
      enabled: true
fixup:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
logging:
  level:
    com.fixup: INFO
    org.springframework.security: INFO
