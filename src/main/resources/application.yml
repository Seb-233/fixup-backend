spring:
  application:
    name: fixup-backend
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${AUTH0_ISSUER_URI}
          audiences: ${AUTH0_AUDIENCE}
          jwk-set-uri: ${AUTH0_JWK_SET_URI:${AUTH0_ISSUER_URI}.well-known/jwks.json}
management:
  endpoints:
    enabled-by-default: false
    web:
      exposure:
        include: health
  endpoint:
    health:
      enabled: true
      show-details: never
      show-components: never
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
fixup:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
  storage:
    endpoint: ${FIXUP_STORAGE_ENDPOINT:http://localhost:9000}
    public-endpoint: ${FIXUP_STORAGE_PUBLIC_ENDPOINT:${fixup.storage.endpoint}}
    access-key: ${FIXUP_STORAGE_ACCESS_KEY}
    secret-key: ${FIXUP_STORAGE_SECRET_KEY}
    bucket: ${FIXUP_STORAGE_BUCKET:fixup-private}
    region: ${FIXUP_STORAGE_REGION:us-east-1}
    auto-create-bucket: false
  media:
    portfolio:
      max-file-size: 10485760
