spring:
  application:
    name: fixup-backend
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration,classpath:db/migration-postgres/{vendor}
  h2:
    console:
      enabled: false
      path: /h2-console
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${AUTH0_ISSUER_URI}
          audiences: ${AUTH0_AUDIENCE}
          jwk-set-uri: ${AUTH0_JWK_SET_URI}
management:
  endpoints:
    enabled-by-default: false
    web:
      exposure:
        include: health
  endpoint:
    health:
      enabled: true
      show-details: never
      show-components: never
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
fixup:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
  geocoding:
    enabled: ${FIXUP_GEOCODING_ENABLED:true}
    base-url: ${FIXUP_GEOCODING_BASE_URL:https://nominatim.openstreetmap.org}
    user-agent: "${FIXUP_GEOCODING_USER_AGENT:FixUp/1.0 (+https://github.com/Seb-233/fixup-backend)}"
    connect-timeout: ${FIXUP_GEOCODING_CONNECT_TIMEOUT:2s}
    read-timeout: ${FIXUP_GEOCODING_READ_TIMEOUT:3s}
    cache-ttl: ${FIXUP_GEOCODING_CACHE_TTL:10m}
    max-cache-entries: ${FIXUP_GEOCODING_MAX_CACHE_ENTRIES:256}
  storage:
    endpoint: ${FIXUP_STORAGE_ENDPOINT}
    public-endpoint: ${FIXUP_STORAGE_PUBLIC_ENDPOINT:${fixup.storage.endpoint}}
    access-key: ${FIXUP_STORAGE_ACCESS_KEY}
    secret-key: ${FIXUP_STORAGE_SECRET_KEY}
    bucket: ${FIXUP_STORAGE_BUCKET:fixup-private}
    region: ${FIXUP_STORAGE_REGION:us-east-1}
    auto-create-bucket: false
  media:
    portfolio:
      max-file-size: 10485760
    deletion:
      enabled: ${FIXUP_MEDIA_DELETION_ENABLED:true}
      polling-delay: ${FIXUP_MEDIA_DELETION_POLLING_DELAY:30s}
      batch-size: ${FIXUP_MEDIA_DELETION_BATCH_SIZE:10}
      lock-timeout: ${FIXUP_MEDIA_DELETION_LOCK_TIMEOUT:5m}
      max-attempts: ${FIXUP_MEDIA_DELETION_MAX_ATTEMPTS:5}
      initial-backoff: ${FIXUP_MEDIA_DELETION_INITIAL_BACKOFF:30s}
